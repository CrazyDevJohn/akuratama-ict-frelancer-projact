<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akuratama ICT - Paid Classes</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="./database/api-calls.js"></script>
    <link rel="stylesheet" href="myclass.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", "Segoe UI", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 1000px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 30px;
        overflow: hidden;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        animation: slideUp 0.5s ease-out;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Header */
      .header {
        background: linear-gradient(135deg, #0f1b3d 0%, #1a2980 100%);
        color: white;
        padding: 25px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      .header::before {
        content: "";
        position: absolute;
        top: -50%;
        right: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 1px,
          transparent 1px
        );
        background-size: 30px 30px;
        opacity: 0.15;
        animation: float 25s linear infinite;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        100% {
          transform: translate(-30px, -30px) rotate(360deg);
        }
      }

      .logo-container {
        display: flex;
        align-items: center;
        gap: 18px;
        position: relative;
        z-index: 1;
      }

      .logo-circle {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #4a90e2, #1a2980);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 25px rgba(26, 41, 128, 0.4);
        border: 3px solid rgba(255, 255, 255, 0.4);
      }

      .logo-icon {
        font-size: 28px;
        color: white;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
      }

      .logo-text {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(to right, #ffffff, #b3d1ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
      }

      .back-btn {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.3);
        padding: 14px 30px;
        border-radius: 50px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        z-index: 1;
        backdrop-filter: blur(10px);
        text-decoration: none;
      }

      .back-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateX(-8px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .back-btn i {
        font-size: 18px;
        transition: transform 0.3s ease;
      }

      .back-btn:hover i {
        transform: translateX(-5px);
      }

      /* Main Content */
      .content {
        padding: 60px 40px;
        text-align: center;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.95),
          rgba(248, 250, 252, 0.95)
        );
      }

      .title {
        font-size: 40px;
        color: #1a2980;
        margin-bottom: 50px;
        font-weight: 700;
        position: relative;
        display: inline-block;
      }

      .title::after {
        content: "";
        position: absolute;
        bottom: -12px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 4px;
        background: linear-gradient(to right, #4a90e2, #1a2980);
        border-radius: 2px;
      }



      /* Instruction */
      .instruction {
        color: #4a5568;
        font-size: 18px;
        font-weight: 500;
        margin-top: 20px;
        margin-bottom: 30px;
      }



      /* Footer */
      .footer {
        text-align: center;
        padding: 25px;
        color: #718096;
        font-size: 14px;
        border-top: 1px solid rgba(226, 232, 240, 0.5);
        background: rgba(248, 250, 252, 0.8);
      }


      @media (max-width: 768px) {
        .container {
          border-radius: 20px;
        }

        .header {
          padding: 20px;
          flex-direction: column;
          gap: 20px;
          text-align: center;
        }

        .content {
          padding: 40px 20px;
        }

        .title {
          font-size: 32px;
          margin-bottom: 30px;
        }


        .back-btn {
          padding: 12px 25px;
        }
      }

      @media (max-width: 480px) {
        .logo-text {
          font-size: 24px;
        }

        .title {
          font-size: 28px;
        }

       
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <div class="logo-container">
          <div class="logo-circle">
            <i class="fas fa-brain logo-icon"></i>
          </div>
          <div class="logo-text">Akuratama ICT</div>
        </div>
        <a href="Dash.html" class="back-btn" id="backBtn">
          <i class="fas fa-arrow-left"></i> back to dashboard
        </a>
      </div>

      <!-- Main Content -->
      <div class="content">
        <h1 class="title">Available Courses</h1>
        <div class="instruction">
          Available My Classes for ICT<br />
          ඔබ හට අධ්‍යනය කල හැකි පන්ති පහතින් දැක්වේ.
        </div>

        <div id="page1" class="page active">
      <div class="container">
        <div class="page-title">
          <h2>AL ICT Lesson Modules</h2>
          <p>Select a lesson to access past papers and study materials</p>
        </div>

        <div class="lessons-grid" id="lessonsGrid">
          <!-- Lesson cards will be populated by JavaScript -->
        </div>
      </div>
    </div>
       

      <!-- Footer -->
      <div class="footer">© 2026 Akuratama ICT. All rights reserved.</div>
    </div>

    <script>
      let enrolledCourses = [];
      (async function () {
        const res = await fetchAllCoursesForStudent();
        enrolledCourses = res;
        renderLessons();
      })();

     
      // ====== RENDER LESSONS ======
      function renderLessons() {
        // lessonsGrid.innerHTML = "";

        enrolledCourses.forEach((lesson) => {
          const card = document.createElement("div");
          card.className = "lesson-card";
          card.dataset.lessonId = lesson.id;

          console.log(lesson);

          card.innerHTML = `
                    <div class="lesson-number">${lesson._id}</div>
                    <div class="lesson-title">${lesson.title}</div>
                    <p class="lesson-description">${lesson.description}</p>
                    <div class="lesson-code">view course</div>
                    <div style="margin-top: 16px; display: flex; gap: 12px; font-size: 0.85rem; color: var(--gray);">
                        <span><i class="fas fa-file-pdf"></i> ${lesson.modules} modules</span>
                        <span><i class="fas fa-video"></i> ${lesson.lessons} lessons</span>
                    </div>
                `;

          card.addEventListener("click", () => selectLesson(lesson));
          lessonsGrid.appendChild(card);
        });
      }

      // ====== SELECT LESSON ======
      function selectLesson(lesson) {
        window.location.href = `view.html?courseId=${lesson._id}`;
      }
    </script>
  </body>
</html>
