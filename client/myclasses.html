<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akuratama ICT - Paid Classes</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="./database/api-calls.js"></script>
    <link rel="stylesheet" href="myclass.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", "Segoe UI", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 1000px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 30px;
        overflow: hidden;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        animation: slideUp 0.5s ease-out;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(40px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Header */
      .header {
        background: linear-gradient(135deg, #0f1b3d 0%, #1a2980 100%);
        color: white;
        padding: 25px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      .header::before {
        content: "";
        position: absolute;
        top: -50%;
        right: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 1px,
          transparent 1px
        );
        background-size: 30px 30px;
        opacity: 0.15;
        animation: float 25s linear infinite;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        100% {
          transform: translate(-30px, -30px) rotate(360deg);
        }
      }

      .logo-container {
        display: flex;
        align-items: center;
        gap: 18px;
        position: relative;
        z-index: 1;
      }

      .logo-circle {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #4a90e2, #1a2980);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 25px rgba(26, 41, 128, 0.4);
        border: 3px solid rgba(255, 255, 255, 0.4);
      }

      .logo-icon {
        font-size: 28px;
        color: white;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
      }

      .logo-text {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(to right, #ffffff, #b3d1ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
      }

      .back-btn {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.3);
        padding: 14px 30px;
        border-radius: 50px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        gap: 12px;
        position: relative;
        z-index: 1;
        backdrop-filter: blur(10px);
        text-decoration: none;
      }

      .back-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateX(-8px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .back-btn i {
        font-size: 18px;
        transition: transform 0.3s ease;
      }

      .back-btn:hover i {
        transform: translateX(-5px);
      }

      /* Main Content */
      .content {
        padding: 60px 40px;
        text-align: center;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.95),
          rgba(248, 250, 252, 0.95)
        );
      }

      .title {
        font-size: 40px;
        color: #1a2980;
        margin-bottom: 50px;
        font-weight: 700;
        position: relative;
        display: inline-block;
      }

      .title::after {
        content: "";
        position: absolute;
        bottom: -12px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 4px;
        background: linear-gradient(to right, #4a90e2, #1a2980);
        border-radius: 2px;
      }



      /* Instruction */
      .instruction {
        color: #4a5568;
        font-size: 18px;
        font-weight: 500;
        margin-top: 20px;
        margin-bottom: 30px;
      }



      /* Footer */
      .footer {
        text-align: center;
        padding: 25px;
        color: #718096;
        font-size: 14px;
        border-top: 1px solid rgba(226, 232, 240, 0.5);
        background: rgba(248, 250, 252, 0.8);
      }


      @media (max-width: 768px) {
        .container {
          border-radius: 20px;
        }

        .header {
          padding: 20px;
          flex-direction: column;
          gap: 20px;
          text-align: center;
        }

        .content {
          padding: 40px 20px;
        }

        .title {
          font-size: 32px;
          margin-bottom: 30px;
        }


        .back-btn {
          padding: 12px 25px;
        }
      }

      @media (max-width: 480px) {
        .logo-text {
          font-size: 24px;
        }

        .title {
          font-size: 28px;
        }

       
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <div class="logo-container">
          <div class="logo-circle">
            <i class="fas fa-brain logo-icon"></i>
          </div>
          <div class="logo-text">Akuratama ICT</div>
        </div>
        <a href="Dash.html" class="back-btn" id="backBtn">
          <i class="fas fa-arrow-left"></i> back to dashboard
        </a>
      </div>

      <!-- Main Content -->
      <div class="content">
        <h1 class="title">Available Courses</h1>
        <div class="instruction">
          Available My Classes for ICT<br />
          ඔබ හට අධ්‍යනය කල හැකි පන්ති පහතින් දැක්වේ.
        </div>

        <div id="page1" class="page active">
      <div class="container">
        <div class="page-title">
          <h2>AL ICT Lesson Modules</h2>
          <p>Select a lesson to access past papers and study materials</p>
        </div>

        <div class="lessons-grid" id="lessonsGrid">
          <!-- Lesson cards will be populated by JavaScript -->
        </div>
      </div>
    </div>
       

      <!-- Footer -->
      <div class="footer">© 2026 Akuratama ICT. All rights reserved.</div>
    </div>

    <script>
      let enrolledCourses = [];
      (async function () {
        const res = await fetchAllCoursesForStudent();
        enrolledCourses = res;
        renderLessons();
      })();

      // ====== APPLICATION STATE ======
      let currentLesson = null;
      let currentPhotos = [];
      let currentPhotoIndex = 0;
      let timerInterval = null;
      let isTimerPaused = false;
      let secondsRemaining = 600; // 10 minutes = 600 seconds
      const totalSeconds = 600; // 10 minutes = 600 seconds
      let zoomLevel = 1;

      // ====== DOM ELEMENTS ======
      const page1 = document.getElementById("page1");
      const page2 = document.getElementById("page2");
      const page3 = document.getElementById("page3");
      const lessonsGrid = document.getElementById("lessonsGrid");
      const currentLessonTitle = document.getElementById("currentLessonTitle");
      const currentLessonDescription = document.getElementById(
        "currentLessonDescription",
      );
      const videoLessonTitle = document.getElementById("videoLessonTitle");
      const photoCountBadge = document.getElementById("photoCountBadge");
      const backToLessonsBtn = document.getElementById("backToLessons");
      const timerDisplay = document.getElementById("timerDisplay");
      const timerProgress = document.getElementById("timerProgress");
      const timerContainer = document.getElementById("timerContainer");
      const pauseTimerBtn = document.getElementById("pauseTimer");
      const resetTimerBtn = document.getElementById("resetTimer");
      const photoThumbnails = document.getElementById("photoThumbnails");
      const mainPhoto = document.getElementById("mainPhoto");
      const photoCounter = document.getElementById("photoCounter");
      const prevPhotoBtn = document.getElementById("prevPhoto");
      const nextPhotoBtn = document.getElementById("nextPhoto");
      const viewFullscreenBtn = document.getElementById("viewFullscreen");
      const continueToVideoBtn = document.getElementById("continueToVideo");
      const backToPapersBtn = document.getElementById("backToPapers");
      const backToHomeBtn = document.getElementById("backToHome");
      const notificationPopup = document.getElementById("notificationPopup");
      const continueStudyingBtn = document.getElementById("continueStudying");
      const goToVideoBtn = document.getElementById("goToVideo");
      const fullscreenViewer = document.getElementById("fullscreenViewer");
      const fullscreenImage = document.getElementById("fullscreenImage");
      const closeFullscreenBtn = document.getElementById("closeFullscreen");
      const zoomInBtn = document.getElementById("zoomIn");
      const zoomOutBtn = document.getElementById("zoomOut");

      // ====== PAGE NAVIGATION ======
      function showPage(pageNumber) {
        // Hide all pages
        page1.classList.remove("active");
        page2.classList.remove("active");
        page3.classList.remove("active");

        // Show selected page
        if (pageNumber === 1) {
          page1.classList.add("active");
          // Stop timer when leaving page 2
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
        }
        if (pageNumber === 2) {
          page2.classList.add("active");
          // Start timer when entering page 2
          if (!timerInterval) {
            startTimer();
          }
        }
        if (pageNumber === 3) {
          page3.classList.add("active");
          // Update video page title
          if (currentLesson) {
            videoLessonTitle.textContent = `Lesson ${currentLesson.id}: ${currentLesson.title}`;
          }
          // Stop timer when on video page
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
        }
      }

      // ====== INITIALIZATION ======
      function initializeApp() {
        // renderLessons();
        setupEventListeners();
      }

      // ====== RENDER LESSONS ======
      function renderLessons() {
        // lessonsGrid.innerHTML = "";

        enrolledCourses.forEach((lesson) => {
          const card = document.createElement("div");
          card.className = "lesson-card";
          card.dataset.lessonId = lesson.id;

          console.log(lesson);

          card.innerHTML = `
                    <div class="lesson-number">${lesson._id}</div>
                    <div class="lesson-title">${lesson.title}</div>
                    <p class="lesson-description">${lesson.description}</p>
                    <div class="lesson-code">view course</div>
                    <div style="margin-top: 16px; display: flex; gap: 12px; font-size: 0.85rem; color: var(--gray);">
                        <span><i class="fas fa-file-pdf"></i> ${lesson.modules} modules</span>
                        <span><i class="fas fa-video"></i> ${lesson.lessons} lessons</span>
                    </div>
                `;

          card.addEventListener("click", () => selectLesson(lesson));
          lessonsGrid.appendChild(card);
        });
      }

      // ====== SELECT LESSON ======
      function selectLesson(lesson) {
        window.location.href = `view.html?courseId=${lesson._id}`;
      }

      // ====== RENDER PHOTO GALLERY ======
      function renderPhotoGallery() {
        photoThumbnails.innerHTML = "";

        currentPhotos.forEach((photo, index) => {
          const thumb = document.createElement("div");
          thumb.className = "photo-thumb";
          if (index === currentPhotoIndex) thumb.classList.add("active");

          thumb.innerHTML = `<img src="${photo}" alt="Paper ${index + 1}" loading="lazy">`;
          thumb.addEventListener("click", () => showPhoto(index));
          photoThumbnails.appendChild(thumb);
        });

        showPhoto(currentPhotoIndex);
      }

      // ====== SHOW PHOTO ======
      function showPhoto(index) {
        currentPhotoIndex = index;
        mainPhoto.src = currentPhotos[index];
        fullscreenImage.src = currentPhotos[index];
        photoCounter.textContent = `${index + 1}/${currentPhotos.length}`;

        document.querySelectorAll(".photo-thumb").forEach((thumb, i) => {
          thumb.classList.toggle("active", i === index);
        });

        // Update button states
        prevPhotoBtn.disabled = index === 0;
        nextPhotoBtn.disabled = index === currentPhotos.length - 1;
      }

      // ====== TIMER FUNCTIONS ======
      function startTimer() {
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
          if (!isTimerPaused && page2.classList.contains("active")) {
            secondsRemaining--;
            updateTimerDisplay();

            if (secondsRemaining <= 0) {
              clearInterval(timerInterval);
              timerInterval = null;
              // Show notification when timer ends
              showTimeUpNotification();
            }
          }
        }, 1000);
      }

      function showTimeUpNotification() {
        notificationPopup.classList.add("active");

        // Auto close notification after 30 seconds
        setTimeout(() => {
          if (notificationPopup.classList.contains("active")) {
            notificationPopup.classList.remove("active");
            showPage(3);
          }
        }, 30000);
      }

      function pauseTimer() {
        isTimerPaused = !isTimerPaused;
        pauseTimerBtn.innerHTML = isTimerPaused
          ? '<i class="fas fa-play"></i> Resume'
          : '<i class="fas fa-pause"></i> Pause';

        // Show pause status visually
        if (isTimerPaused) {
          timerDisplay.classList.add("paused");
          timerContainer.classList.add("paused");
        } else {
          timerDisplay.classList.remove("paused");
          timerContainer.classList.remove("paused");
        }
      }

      function resetTimer() {
        secondsRemaining = totalSeconds;
        isTimerPaused = false;
        pauseTimerBtn.innerHTML = '<i class="fas fa-pause"></i> Pause';
        timerDisplay.classList.remove("paused");
        timerContainer.classList.remove("paused");
        updateTimerDisplay();

        if (timerInterval) {
          clearInterval(timerInterval);
        }
        startTimer();
      }

      function updateTimerDisplay() {
        const minutes = Math.floor(secondsRemaining / 60);
        const seconds = secondsRemaining % 60;

        timerDisplay.textContent = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;

        // Update progress bar
        const progress = (secondsRemaining / totalSeconds) * 100;
        timerProgress.style.width = `${progress}%`;

        // Change colors based on time remaining
        if (secondsRemaining <= 60) {
          // Last minute (60 seconds)
          timerDisplay.classList.add("timer-danger");
          timerDisplay.classList.remove("timer-warning");
          timerProgress.style.backgroundColor = "var(--accent)";
          timerContainer.style.borderColor = "var(--accent)";
        } else if (secondsRemaining <= 180) {
          // Last 3 minutes (180 seconds)
          timerDisplay.classList.add("timer-warning");
          timerDisplay.classList.remove("timer-danger");
          timerProgress.style.backgroundColor = "var(--warning)";
          timerContainer.style.borderColor = "var(--warning)";
        } else {
          timerDisplay.classList.remove("timer-warning", "timer-danger");
          timerProgress.style.backgroundColor = "var(--success)";
          timerContainer.style.borderColor = "var(--success)";
        }
      }

      // ====== FULLSCREEN VIEWER FUNCTIONS ======
      function openFullscreen() {
        fullscreenViewer.classList.add("active");
        document.body.style.overflow = "hidden";
        zoomLevel = 1;
        updateFullscreenZoom();
      }

      function closeFullscreen() {
        fullscreenViewer.classList.remove("active");
        document.body.style.overflow = "auto";
      }

      function updateFullscreenZoom() {
        fullscreenImage.style.transform = `scale(${zoomLevel})`;
      }

      function zoomIn() {
        if (zoomLevel < 3) {
          zoomLevel += 0.25;
          updateFullscreenZoom();
        }
      }

      function zoomOut() {
        if (zoomLevel > 0.5) {
          zoomLevel -= 0.25;
          updateFullscreenZoom();
        }
      }

      // ====== SETUP EVENT LISTENERS ======
      function setupEventListeners() {
        // Navigation buttons
        backToLessonsBtn.addEventListener("click", () => showPage(1));
        continueToVideoBtn.addEventListener("click", () => showPage(3));
        backToPapersBtn.addEventListener("click", () => showPage(2));
        backToHomeBtn.addEventListener("click", () => showPage(1));

        // Timer controls
        pauseTimerBtn.addEventListener("click", pauseTimer);
        resetTimerBtn.addEventListener("click", resetTimer);

        // Notification buttons
        continueStudyingBtn.addEventListener("click", () => {
          notificationPopup.classList.remove("active");
          resetTimer();
        });

        goToVideoBtn.addEventListener("click", () => {
          notificationPopup.classList.remove("active");
          showPage(3);
        });

        // Photo gallery controls
        prevPhotoBtn.addEventListener("click", () => {
          if (currentPhotoIndex > 0) showPhoto(currentPhotoIndex - 1);
        });

        nextPhotoBtn.addEventListener("click", () => {
          if (currentPhotoIndex < currentPhotos.length - 1)
            showPhoto(currentPhotoIndex + 1);
        });

        // Fullscreen viewer
        viewFullscreenBtn.addEventListener("click", openFullscreen);
        closeFullscreenBtn.addEventListener("click", closeFullscreen);
        zoomInBtn.addEventListener("click", zoomIn);
        zoomOutBtn.addEventListener("click", zoomOut);

        // Keyboard shortcuts
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeFullscreen();
            notificationPopup.classList.remove("active");
          }

          if (page2.classList.contains("active")) {
            switch (e.key) {
              case "ArrowLeft":
                if (currentPhotoIndex > 0) showPhoto(currentPhotoIndex - 1);
                break;
              case "ArrowRight":
                if (currentPhotoIndex < currentPhotos.length - 1)
                  showPhoto(currentPhotoIndex + 1);
                break;
              case " ":
                e.preventDefault();
                pauseTimer();
                break;
              case "f":
              case "F":
                if (!fullscreenViewer.classList.contains("active")) {
                  openFullscreen();
                }
                break;
            }
          }
        });

        // Click outside fullscreen to close
        fullscreenViewer.addEventListener("click", (e) => {
          if (e.target === fullscreenViewer) {
            closeFullscreen();
          }
        });

        // Click outside notification to close
        notificationPopup.addEventListener("click", (e) => {
          if (e.target === notificationPopup) {
            notificationPopup.classList.remove("active");
            showPage(3);
          }
        });

        // Preload first lesson images for better performance
        window.addEventListener("load", () => {
          const firstLessonImages = lessonImages[1] || [];
          firstLessonImages.forEach((imgSrc) => {
            const img = new Image();
            img.src = imgSrc;
          });
        });
      }

      // ====== INITIALIZE APP ======
      document.addEventListener("DOMContentLoaded", initializeApp);
      // Initialize when page loads
      document.addEventListener("DOMContentLoaded", function () {
        const tabButtons = document.querySelectorAll(".tab-btn");
        const gradeCards = document.querySelectorAll(".grade-card");
        const backButton = document.getElementById("backBtn");
        const continueButton = document.getElementById("continueBtn");
        const selectionInfo = document.getElementById("selectionInfo");
        const selectedText = document.getElementById("selectedText");
        let selectedGrade = null;

        // Handle tab button clicks
        tabButtons.forEach((button) => {
          button.addEventListener("click", function () {
            // Remove active class from all tabs
            tabButtons.forEach((btn) => btn.classList.remove("active"));

            // Add active class to clicked tab
            this.classList.add("active");

            // Get which tab to show
            const tabId = this.getAttribute("data-tab");

            // Hide all grade cards
            document.getElementById("grade6-9").style.display = "none";
            document.getElementById("grade10-11").style.display = "none";
            document.getElementById("grade-al").style.display = "none";

            // Show selected grade cards with animation
            if (tabId === "6-9") {
              document.getElementById("grade6-9").style.display = "grid";
            } else if (tabId === "10-11") {
              document.getElementById("grade10-11").style.display = "grid";
            } else if (tabId === "al") {
              document.getElementById("grade-al").style.display = "grid";
            }

            // Reset selection when switching tabs
            gradeCards.forEach((card) => card.classList.remove("selected"));
            selectionInfo.classList.remove("show");
            selectedGrade = null;
          });
        });

        // Handle grade card clicks
        gradeCards.forEach((card) => {
          card.addEventListener("click", function () {
            // Remove selected class from all cards
            gradeCards.forEach((c) => c.classList.remove("selected"));

            // Add selected class to clicked card
            this.classList.add("selected");

            // Get selected grade info
            const grade = this.getAttribute("data-grade");
            selectedGrade = grade;

            // Display appropriate message
            let displayText = "";
            if (grade === "2026-al") {
              displayText = "2026 Advanced Level Selected";
            } else if (grade === "2027-al") {
              displayText = "2027 Advanced Level Selected";
            } else if (grade === "paper-discussion") {
              displayText = "A/L Paper Discussion Selected";
            } else {
              displayText = `Grade ${grade} Selected`;
            }

            // Update and show selection info
            selectedText.textContent = displayText;
            selectionInfo.classList.add("show");

            // Scroll selection info into view on mobile
            if (window.innerWidth <= 768) {
              selectionInfo.scrollIntoView({
                behavior: "smooth",
                block: "nearest",
              });
            }
          });
        });

        // Handle continue button click - NO ALERT MESSAGE
        continueButton.addEventListener("click", function () {
          if (!selectedGrade) {
            // Don't show alert, just highlight that selection is needed
            const instruction = document.querySelector(".instruction");
            instruction.style.color = "#e74c3c";
            instruction.style.fontWeight = "700";
            instruction.textContent = "Please select a grade first!";

            // Reset after 2 seconds
            setTimeout(() => {
              instruction.style.color = "#4a5568";
              instruction.style.fontWeight = "500";
              instruction.textContent = "Select your grade level to continue";
            }, 2000);
            return;
          }

          // Button animation
          this.style.transform = "scale(0.95)";
          setTimeout(() => {
            this.style.transform = "scale(1)";
          }, 200);

          // NO ALERT MESSAGE - Just update the selection info
          let message = "";
          if (selectedGrade === "2026-al") {
            message = "Loading 2026 Advanced Level content...";
          } else if (selectedGrade === "2027-al") {
            message = "Loading 2027 Advanced Level content...";
          } else if (selectedGrade === "paper-discussion") {
            message = "Opening A/L Paper Discussion...";
          } else {
            message = `Loading Grade ${selectedGrade} content...`;
          }

          // Update selection info text
          selectedText.textContent = message;

          // Here you would normally redirect or load content for the selected grade
        });

        // Add ripple effect to all buttons
        document.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", function (e) {
            const ripple = document.createElement("span");
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size / 2;
            const y = e.clientY - rect.top - size / 2;

            ripple.style.cssText = `
                        position: absolute;
                        border-radius: 50%;
                        background: rgba(255, 255, 255, 0.4);
                        transform: scale(0);
                        animation: ripple 0.6s linear;
                        width: ${size}px;
                        height: ${size}px;
                        top: ${y}px;
                        left: ${x}px;
                        pointer-events: none;
                    `;

            this.appendChild(ripple);

            setTimeout(() => {
              ripple.remove();
            }, 600);
          });
        });

        // Add CSS for ripple animation
        const style = document.createElement("style");
        style.textContent = `
                @keyframes ripple {
                    to {
                        transform: scale(4);
                        opacity: 0;
                    }
                }
            `;
        document.head.appendChild(style);
      });
    </script>
  </body>
</html>
